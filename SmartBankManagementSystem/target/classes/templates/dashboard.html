<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Smart Bank Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial;  
        }

        body{
            background:#f4f6f9;
        }

        .navbar{
            background:#111827;
            color:white;
            padding:20px;
            text-align:center;
            font-size:28px;
            font-weight:bold;
        }

        .main{
            width:90%;
            margin:auto;
            margin-top:30px;
        }

        .welcomeCard{
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            margin-bottom:25px;
        }

        .welcomeCard h2{
            margin-bottom:10px;
        }

        .balance{
            color:green;
            font-size:32px;
            font-weight:bold;
        }

        .message{
            margin-top:10px;
            color:green;
            font-weight:bold;
        }

        .error{
            margin-top:10px;
            color:red;
            font-weight:bold;
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .card h3{
            margin-bottom:15px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        .depositBtn{
            background:green;
        }

        .withdrawBtn{
            background:red;
        }

        .transferBtn{
            background:#2563eb;
        }

        .loanBtn{
            background:purple;
        }

        .statementBtn{
            background:black;
        }

        .viewLoanBtn{
            background:#0f766e;
        }

        .bottomButtons{
            margin-top:25px;
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:20px;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="navbar">

    Smart Bank Management System

</div>

<div class="main">

    <div class="welcomeCard">

        <h2>
            Welcome,
            <span th:text="${user.fullName}"></span>
        </h2>

        <p>Your Current Balance</p>

        <div class="balance">

            ₹ <span th:text="${user.balance}"></span>

        </div>

        <div class="message"
             th:text="${success}">
        </div>

        <div class="error"
             th:text="${error}">
        </div>

    </div>

    <div class="grid">

        <!-- DEPOSIT -->

        <div class="card">

            <h3>Deposit Money</h3>

            <form th:action="@{/deposit}"
                  method="post">

                <input type="number"
                       name="amount"
                       placeholder="Enter Amount"
                       required>

                <button class="depositBtn"
                        type="submit">

                    Deposit

                </button>

            </form>

        </div>

        <!-- WITHDRAW -->

        <div class="card">

            <h3>Withdraw Money</h3>

            <form th:action="@{/withdraw}"
                  method="post">

                <input type="number"
                       name="amount"
                       placeholder="Enter Amount"
                       required>

                <button class="withdrawBtn"
                        type="submit">

                    Withdraw

                </button>

            </form>

        </div>

        <!-- TRANSFER -->

        <div class="card">

            <h3>Transfer Money</h3>

            <form th:action="@{/transfer}"
                  method="post">

                <input type="email"
                       name="receiverEmail"
                       placeholder="Receiver Email"
                       required>

                <input type="number"
                       name="amount"
                       placeholder="Enter Amount"
                       required>

                <button class="transferBtn"
                        type="submit">

                    Transfer

                </button>

            </form>

        </div>

        <!-- LOAN -->

        <div class="card">

            <h3>Loan Services</h3>

            <a href="/loan">

                <button class="loanBtn">

                    Apply Loan

                </button>

            </a>

            <a href="/viewLoans">

                <button class="viewLoanBtn">

                    View Loans

                </button>

            </a>

        </div>

    </div>

    <!-- BOTTOM BUTTONS -->

    <div class="bottomButtons">

        <a href="/statement">

            <button class="statementBtn">

                Mini Statement

            </button>

        </a>

        <a href="/admin">

            <button class="loanBtn">

                Admin Panel

            </button>

        </a>

        <a href="/login">

            <button class="withdrawBtn">

                Logout

            </button>

        </a>

    </div>

</div>

</body>

</html>
